<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #f6f6f4;
        --paper: #ffffff;
        --ink: #171717;
        --muted: #6f7177;
        --accent: #d2261c;
        --accent-soft: #fdecea;
        --line: #ecebe8;
        --hairline: rgba(23, 23, 23, 0.09);
        --ok: #2da44e;
        --shadow: 0 1px 2px rgba(23, 23, 23, 0.05), 0 12px 32px rgba(23, 23, 23, 0.08), 0 40px 90px rgba(23, 23, 23, 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #film {
        position: absolute;
        inset: 0;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(1200px 800px at 18% 30%, #fbfaf8 0%, var(--bg) 60%), var(--bg);
      }

      /* Background layer */
      .bg-glow {
        position: absolute;
        width: 1100px;
        height: 1100px;
        right: -260px;
        top: -320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(210, 38, 28, 0.1) 0%, rgba(210, 38, 28, 0) 62%);
      }
      .bg-version {
        position: absolute;
        right: -40px;
        bottom: -120px;
        font-size: 420px;
        font-weight: 800;
        letter-spacing: -0.06em;
        color: rgba(23, 23, 23, 0.035);
        line-height: 1;
        white-space: nowrap;
      }
      .rule {
        position: absolute;
        left: 120px;
        right: 120px;
        top: 96px;
        height: 1px;
        background: var(--hairline);
        transform-origin: left center;
      }
      .meta {
        position: absolute;
        left: 120px;
        top: 52px;
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .meta .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
      }

      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        padding: 140px 120px 110px;
        gap: 80px;
      }

      /* Scene 1 — providers */
      .brand {
        display: flex;
        align-items: center;
        gap: 36px;
        flex: 0 0 auto;
      }
      .logo {
        width: 220px;
        height: 220px;
        flex: 0 0 auto;
      }
      .wordmark {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .wordmark h1 {
        font-size: 150px;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 0.95;
      }
      .wordmark .version {
        font-size: 34px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: -0.01em;
      }
      .times {
        font-size: 96px;
        font-weight: 500;
        color: var(--accent);
        flex: 0 0 auto;
      }
      .pills {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .pill {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 24px 30px;
        border-radius: 999px;
        background: var(--paper);
        box-shadow: var(--shadow);
        border: 1px solid var(--hairline);
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .pill i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--ok);
        flex: 0 0 auto;
      }
      .pill.local i {
        background: var(--accent);
      }

      /* Scene 2 — page + chat */
      #s2 {
        justify-content: center;
        gap: 72px;
      }
      .doc {
        position: relative;
        width: 600px;
        height: 780px;
        flex: 0 0 auto;
        border-radius: 28px;
        background: var(--paper);
        box-shadow: var(--shadow);
        border: 1px solid var(--hairline);
        padding: 70px 64px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .doc .title-bar {
        height: 30px;
        width: 62%;
        border-radius: 8px;
        background: var(--ink);
        margin-bottom: 18px;
      }
      .doc .ln {
        position: relative;
        height: 16px;
        border-radius: 8px;
        background: var(--line);
      }
      .doc .ln.short {
        width: 72%;
      }
      .doc .hl {
        position: absolute;
        inset: -8px -10px;
        border-radius: 10px;
        background: rgba(210, 38, 28, 0.22);
        transform-origin: left center;
      }
      .field {
        margin-top: 18px;
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .field .box {
        position: relative;
        width: 58px;
        height: 58px;
        border-radius: 14px;
        border: 3px solid var(--ink);
        flex: 0 0 auto;
      }
      .field .fill {
        position: absolute;
        inset: -3px;
        border-radius: 14px;
        background: var(--ink);
      }
      .field svg {
        position: absolute;
        inset: 8px;
        width: 36px;
        height: 36px;
      }
      .field .ln {
        flex: 1 1 auto;
      }
      .pin {
        position: absolute;
        right: -30px;
        top: 118px;
        width: 84px;
        height: 72px;
        border-radius: 36px 36px 36px 8px;
        background: var(--accent-soft);
        border: 3px solid var(--accent);
        box-shadow: 0 10px 28px rgba(210, 38, 28, 0.22);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 0 18px;
      }
      .pin b {
        height: 7px;
        border-radius: 4px;
        background: var(--accent);
      }
      .pin b:last-child {
        width: 60%;
      }
      .pagenum {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 34px;
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        color: var(--muted);
      }

      .chat {
        position: relative;
        width: 720px;
        height: 780px;
        flex: 0 0 auto;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--hairline);
        box-shadow: var(--shadow);
        padding: 48px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .bubble {
        border-radius: 26px;
        padding: 26px 30px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .bubble.user {
        align-self: flex-end;
        width: 62%;
        background: var(--ink);
        border-bottom-right-radius: 8px;
      }
      .bubble.user b {
        height: 14px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.85);
      }
      .bubble.user b:last-child {
        width: 55%;
      }
      .bubble.ai {
        align-self: flex-start;
        width: 84%;
        background: rgba(23, 23, 23, 0.05);
        border-bottom-left-radius: 8px;
      }
      .bubble.ai b {
        height: 14px;
        border-radius: 7px;
        background: rgba(23, 23, 23, 0.22);
        transform-origin: left center;
      }
      .bubble.ai b:nth-child(2) {
        width: 88%;
      }
      .bubble.ai b:nth-child(3) {
        width: 60%;
      }
      .calls {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 6px;
      }
      .call {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 27px;
        font-weight: 600;
        color: var(--muted);
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
        letter-spacing: -0.01em;
      }
      .call .ok {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--ok);
        flex: 0 0 auto;
        display: grid;
        place-items: center;
      }
      .call .ok svg {
        width: 20px;
        height: 20px;
      }
      .lock {
        position: absolute;
        right: 40px;
        bottom: 40px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 26px;
        border-radius: 999px;
        background: var(--ink);
        color: #f4f3f0;
        font-size: 26px;
        font-weight: 600;
      }
      .lock svg {
        width: 34px;
        height: 34px;
      }

      /* Scene 3 — lockup */
      #s3 {
        justify-content: space-between;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 56px;
        flex: 0 0 auto;
      }
      .count {
        font-size: 230px;
        font-weight: 800;
        letter-spacing: -0.06em;
        color: var(--accent);
        line-height: 1;
        min-width: 360px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 76px);
        gap: 16px;
      }
      .tile {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        background: var(--paper);
        border: 1px solid var(--hairline);
        box-shadow: 0 1px 2px rgba(23, 23, 23, 0.05), 0 8px 22px rgba(23, 23, 23, 0.07);
        display: grid;
        place-items: center;
      }
      .tile b {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--accent-soft);
        border: 3px solid var(--accent);
      }
      .tile:nth-child(3n) b {
        border-radius: 50%;
      }
      .tile:nth-child(4n + 2) b {
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1920" data-height="1080">
      <div id="film" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div class="bg-glow" id="bg-glow"></div>
        <div class="bg-version" id="bg-version" aria-hidden="true" data-layout-ignore>0.3.154</div>
        <div class="meta" id="meta"><span class="dot"></span><span>Slate</span><span>·</span><span>0.3.154</span></div>
        <div class="rule" id="rule"></div>

        <section class="scene" id="s1">
          <div class="brand">
            <svg class="logo" id="logo1" viewBox="140 120 744 744" aria-hidden="true">
              <defs>
                <linearGradient id="lg1" x1="190" y1="150" x2="834" y2="884" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#ED4B41" />
                  <stop offset="1" stop-color="#B3120B" />
                </linearGradient>
              </defs>
              <rect x="140" y="120" width="744" height="744" rx="176" fill="url(#lg1)" />
              <g fill="#ffffff">
                <rect x="320" y="356" width="384" height="64" rx="32" />
                <rect x="320" y="464" width="384" height="64" rx="32" opacity="0.85" />
                <rect x="320" y="572" width="236" height="64" rx="32" opacity="0.66" />
              </g>
            </svg>
            <div class="wordmark">
              <h1 id="word1">Slate</h1>
              <span class="version" id="ver1">0.3.154</span>
            </div>
          </div>
          <div class="times" id="times">×</div>
          <div class="pills" id="pills">
            <div class="pill"><i></i>Claude</div>
            <div class="pill"><i></i>ChatGPT</div>
            <div class="pill"><i></i>Gemini</div>
            <div class="pill"><i></i>Mistral</div>
            <div class="pill"><i></i>Grok</div>
            <div class="pill"><i></i>OpenRouter</div>
            <div class="pill local"><i></i>Ollama</div>
            <div class="pill local"><i></i>LM Studio</div>
          </div>
        </section>

        <section class="scene" id="s2">
          <div class="doc" id="doc">
            <div class="title-bar"></div>
            <div class="ln"></div>
            <div class="ln"><span class="hl" id="hl"></span></div>
            <div class="ln short"></div>
            <div class="ln"></div>
            <div class="field">
              <div class="box">
                <span class="fill" id="fill"></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path id="tick" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
              </div>
              <div class="ln"></div>
            </div>
            <div class="ln short"></div>
            <div class="ln"></div>
            <div class="ln"></div>
            <div class="ln short"></div>
            <div class="ln"></div>
            <div class="ln short"></div>
            <div class="pin" id="pin"><b></b><b></b></div>
            <div class="pagenum" id="pagenum">1 / 12</div>
          </div>

          <div class="chat" id="chat">
            <div class="bubble user" id="ask"><b></b><b></b></div>
            <div class="bubble ai" id="answer"><b></b><b></b><b></b></div>
            <div class="calls">
              <div class="call" id="call1"><span class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span>find_text</div>
              <div class="call" id="call2"><span class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span>fill_form</div>
              <div class="call" id="call3"><span class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span>add_comment</div>
              <div class="call" id="call4"><span class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span>add_page_numbers</div>
            </div>
            <div class="lock" id="lock">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="3" fill="#f4f3f0" /><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="#f4f3f0" stroke-width="2.4" stroke-linecap="round" /></svg>
              sk-•••• ••••
            </div>
          </div>
        </section>

        <section class="scene" id="s3">
          <div class="brand">
            <svg class="logo" id="logo3" viewBox="140 120 744 744" aria-hidden="true">
              <defs>
                <linearGradient id="lg3" x1="190" y1="150" x2="834" y2="884" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#ED4B41" />
                  <stop offset="1" stop-color="#B3120B" />
                </linearGradient>
              </defs>
              <rect x="140" y="120" width="744" height="744" rx="176" fill="url(#lg3)" />
              <g fill="#ffffff">
                <rect x="320" y="356" width="384" height="64" rx="32" />
                <rect x="320" y="464" width="384" height="64" rx="32" opacity="0.85" />
                <rect x="320" y="572" width="236" height="64" rx="32" opacity="0.66" />
              </g>
            </svg>
            <div class="wordmark">
              <h1 id="word3">Slate</h1>
              <span class="version" id="ver3">0.3.154</span>
            </div>
          </div>
          <div class="tools">
            <div class="count" id="count">+0</div>
            <div class="grid" id="grid">
              <span class="tile"><b></b></span><span class="tile"><b></b></span><span class="tile"><b></b></span><span class="tile"><b></b></span>
              <span class="tile"><b></b></span><span class="tile"><b></b></span><span class="tile"><b></b></span><span class="tile"><b></b></span>
              <span class="tile"><b></b></span><span class="tile"><b></b></span><span class="tile"><b></b></span><span class="tile"><b></b></span>
              <span class="tile"><b></b></span><span class="tile"><b></b></span><span class="tile"><b></b></span><span class="tile"><b></b></span>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const pills = gsap.utils.toArray("#pills .pill");
      const tiles = gsap.utils.toArray("#grid .tile");
      const answerBars = gsap.utils.toArray("#answer b");
      const counter = { value: 0 };
      const tick = document.getElementById("tick");
      const tickLength = 22;
      tick.style.strokeDasharray = tickLength;

      // Chrome: rule + meta, present the whole film.
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "expo.out" }, 0.1);
      tl.fromTo("#meta", { autoAlpha: 0, x: -18 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.25);
      tl.fromTo("#bg-version", { autoAlpha: 0, x: 80 }, { autoAlpha: 1, x: 0, duration: 1.6, ease: "sine.out" }, 0.2);
      tl.fromTo("#bg-glow", { scale: 0.9 }, { scale: 1.08, duration: 7.8, ease: "sine.inOut" }, 0);

      // Scene 1 — Slate meets the AI providers (0 → 2.4 s).
      tl.fromTo("#logo1", { scale: 0.55, autoAlpha: 0, rotation: -8 }, { scale: 1, autoAlpha: 1, rotation: 0, duration: 0.6, ease: "back.out(2.2)" }, 0.15);
      tl.fromTo("#word1", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.7, ease: "expo.out" }, 0.32);
      tl.fromTo("#ver1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power1.out" }, 0.55);
      tl.fromTo("#times", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(3)" }, 0.72);
      tl.fromTo(pills, { y: 28, autoAlpha: 0, scale: 0.92 }, { y: 0, autoAlpha: 1, scale: 1, duration: 0.5, ease: "power3.out", stagger: 0.05 }, 0.85);
      tl.to("#times", { rotation: 90, duration: 0.9, ease: "sine.inOut" }, 1.45);
      tl.to("#s1", { autoAlpha: 0, duration: 0.18, ease: "power2.in" }, 2.22);

      // Scene 2 — the assistant works on the page (2.4 → 5.6 s). Hard cut in.
      tl.fromTo("#s2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05, ease: "none" }, 2.4);
      tl.fromTo("#doc", { x: -70, scale: 0.95, autoAlpha: 0 }, { x: 0, scale: 1, autoAlpha: 1, duration: 0.6, ease: "power4.out" }, 2.42);
      tl.fromTo("#chat", { x: 70, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.55, ease: "expo.out" }, 2.55);
      tl.fromTo("#ask", { scale: 0.7, autoAlpha: 0, transformOrigin: "100% 100%" }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(1.8)" }, 2.85);
      tl.fromTo("#answer", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out" }, 3.1);
      tl.fromTo(answerBars, { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power1.inOut", stagger: 0.12 }, 3.15);

      tl.fromTo("#hl", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 3.4);
      tl.fromTo("#call1", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.25, ease: "power3.out" }, 3.42);

      tl.fromTo("#fill", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.25, ease: "back.out(2)" }, 3.8);
      tl.fromTo(tick, { strokeDashoffset: tickLength }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 3.92);
      tl.fromTo("#call2", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.25, ease: "power3.out" }, 3.82);

      tl.fromTo("#pin", { y: -60, scale: 0.6, autoAlpha: 0 }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "bounce.out" }, 4.2);
      tl.fromTo("#call3", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.25, ease: "power3.out" }, 4.22);

      tl.fromTo("#pagenum", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "circ.out" }, 4.6);
      tl.fromTo("#call4", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.25, ease: "power3.out" }, 4.62);

      tl.fromTo("#lock", { scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.5, ease: "back.out(1.7)" }, 5.0);
      tl.to("#s2", { autoAlpha: 0, scale: 1.04, duration: 0.25, ease: "power2.in" }, 5.35);

      // Scene 3 — lockup, +16 tools (5.6 → 8 s).
      tl.fromTo("#s3", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: "none" }, 5.6);
      tl.fromTo("#logo3", { scale: 0.8, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.65, ease: "power3.out" }, 5.62);
      tl.fromTo("#word3", { autoAlpha: 0, scale: 1.08, transformOrigin: "0% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 5.72);
      tl.fromTo("#ver3", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "sine.out" }, 6.0);
      tl.fromTo("#count", { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power4.out" }, 5.8);
      tl.fromTo(
        counter,
        { value: 0 },
        {
          value: 16,
          duration: 0.9,
          ease: "power2.out",
          onUpdate: () => {
            document.getElementById("count").textContent = `+${Math.round(counter.value)}`;
          },
        },
        5.85,
      );
