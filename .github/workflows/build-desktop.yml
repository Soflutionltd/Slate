name: Build desktop (Windows & Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  PDFIUM_TAG: "chromium/7891"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            pdfium_asset: pdfium-win-x64.tgz
            pdfium_src: bin/pdfium.dll
            pdfium_file: pdfium.dll
            sidecar_ext: ".exe"
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            pdfium_asset: pdfium-linux-x64.tgz
            pdfium_src: lib/libpdfium.so
            pdfium_file: libpdfium.so
            sidecar_ext: ""

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            file \
            wget \
            curl

      - name: Fetch PDFium binary
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          # GitHub release-assets renvoie parfois 504 : retries + backoff.
          URL="https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/${{ matrix.pdfium_asset }}"
          for attempt in 1 2 3 4 5; do
            if curl -L --fail --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 30 --max-time 300 \
              -o pdfium.tgz "$URL"; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "ERREUR : téléchargement PDFium échoué après 5 essais ($URL)" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          mkdir -p pdfium-extract
          tar -xzf pdfium.tgz -C pdfium-extract
          cp "pdfium-extract/${{ matrix.pdfium_src }}" "${{ matrix.pdfium_file }}"
          rm -rf pdfium-extract pdfium.tgz
          ls -la "${{ matrix.pdfium_file }}"

      - name: Build sidecar (alto-mcp)
        shell: bash
        env:
          # openssl-src (vendored, Windows) doit utiliser Strawberry Perl, pas le
          # perl incomplet de Git Bash. Ignoré sur Linux (OpenSSL système).
          OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
        run: |
          set -euo pipefail
          cd src-tauri
          # tauri build.rs valide externalBin pendant la compilation : un
          # placeholder doit exister avant de builder le sidecar lui-même.
          mkdir -p binaries
          touch "binaries/alto-mcp-${{ matrix.triple }}${{ matrix.sidecar_ext }}"
          cargo build --release --bin alto-mcp
          cp "target/release/alto-mcp${{ matrix.sidecar_ext }}" \
            "binaries/alto-mcp-${{ matrix.triple }}${{ matrix.sidecar_ext }}"
          ls -la binaries

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "."
          args: --config src-tauri/tauri.ci.conf.json

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: slate-${{ matrix.triple }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error

      # Noms stables pour /releases/latest/download/… — GitHub sert le .exe
      # aux visiteurs Windows (plus le .app.tar.gz macOS).
      - name: Publish installer to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          fi
          if [[ -z "${TAG}" ]]; then
            echo "Aucune release GitHub — skip publish." >&2
            exit 0
          fi
          mkdir -p dist-upload
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            src="$(find src-tauri/target/release/bundle -type f -name '*-setup.exe' | head -n 1)"
            dest="dist-upload/Slate-windows-x64-setup.exe"
            platform="windows-x86_64"
            if [[ -z "${src}" ]]; then
              src="$(find src-tauri/target/release/bundle -type f -name '*.msi' ! -name '*.sig' | head -n 1)"
              dest="dist-upload/Slate-windows-x64.msi"
            fi
          else
            src="$(find src-tauri/target/release/bundle -type f -name '*.AppImage' | head -n 1)"
            dest="dist-upload/Slate-linux-x64.AppImage"
            platform="linux-x86_64"
            if [[ -z "${src}" ]]; then
              src="$(find src-tauri/target/release/bundle -type f -name '*.deb' | head -n 1)"
              dest="dist-upload/Slate-linux-x64.deb"
            fi
          fi
          if [[ -z "${src}" ]]; then
            echo "Installeur introuvable dans bundle/" >&2
            find src-tauri/target/release/bundle -type f | head
            exit 1
          fi
          cp "${src}" "${dest}"
          upload_files=("${dest}")
          if [[ -f "${src}.sig" ]]; then
            cp "${src}.sig" "${dest}.sig"
            upload_files+=("${dest}.sig")
          fi
          ls -la "${upload_files[@]}"
          gh release upload "${TAG}" "${upload_files[@]}" --repo "${{ github.repository }}" --clobber
          if [[ -f "${dest}.sig" ]]; then
            asset="$(basename "${dest}")"
            url="https://github.com/${{ github.repository }}/releases/download/${TAG}/${asset}"
            bash scripts/merge-updater-manifest.sh "${TAG}" "${platform}" "${dest}.sig" "${url}"
          else
            echo "⚠ ${src}.sig absent — latest.json non mis à jour pour ${platform}." >&2
          fi
