[package]
name = "alto-pdf-engine"
version = "0.1.0"
edition = "2021"
description = "Moteur PDF partagé d'Alto/Slate (PDFium + lopdf) — natif (desktop) et WASM (navigateur)"
license = "AGPL-3.0-or-later"

[lib]
name = "alto_pdf_engine"
path = "src/lib.rs"

[dependencies]
pdfium-render = { git = "https://github.com/ajrcarey/pdfium-render", rev = "0d7f99ad660317d5fd2e9df732db77764873a6d7" }
lopdf = { version = "0.44", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rand = "0.10"
regex = "1"
tracing = "0.1"
ttf-parser = "0.25.1"
# Sous-ensemble des polices embarquées (conserve cmap ; pur Rust sans woff2).
fontcull = { version = "2", default-features = false }

# rayon n'existe pas sur wasm32-unknown-unknown (pas de threads). On ne le lie
# qu'en natif ; les modules basculent sur un parcours séquentiel en WASM (Phase 2).
# mupdf compile la bibliothèque C : natif uniquement (rendu rapide + réparation).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts"] }
# Génération de documents (outil MCP create_document) : natif uniquement, le
# module WASM n'en a pas l'usage et grossirait de plusieurs Mo.
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Pris en compte seulement quand le moteur est testé seul ; l'app et le module
# WASM déclarent le même renvoi dans leur propre Cargo.toml.
[patch.crates-io]
lopdf = { path = "../../vendor/lopdf" }
